    <path d="M 480,670 C 265,640 215,480 230,375 C 240,315 270,255 335,215" fill="none" stroke="#CA8A04" strokeWidth="5.5" strokeLinecap="round" />

    <!-- Outer Grains -->
    <g fill="url(#riceGrainGrad)" stroke="#78350F" strokeWidth="1.2">
      <ellipse cx="325" cy="225" rx="16" ry="7.5" transform="rotate(-32 325 225)" />
      <ellipse cx="300" cy="245" rx="18" ry="8.5" transform="rotate(-42 300 245)" />
      <ellipse cx="278" cy="272" rx="19" ry="9" transform="rotate(-52 278 272)" />
      <ellipse cx="260" cy="305" rx="20" ry="9.5" transform="rotate(-62 260 305)" />
      <ellipse cx="246" cy="342" rx="21" ry="10" transform="rotate(-72 246 342)" />
      <ellipse cx="236" cy="382" rx="21" ry="10" transform="rotate(-82 236 382)" />
      <ellipse cx="232" cy="425" rx="21" ry="10" transform="rotate(-92 232 425)" />
      <ellipse cx="234" cy="468" rx="21" ry="10" transform="rotate(-102 234 468)" />
      <ellipse cx="242" cy="510" rx="21" ry="10" transform="rotate(-112 242 510)" />
      <ellipse cx="258" cy="552" rx="21" ry="10" transform="rotate(-122 258 552)" />
      <ellipse cx="280" cy="590" rx="21" ry="10" transform="rotate(-132 280 590)" />
      <ellipse cx="310" cy="624" rx="20" ry="10" transform="rotate(-142 310 624)" />
      <ellipse cx="348" cy="650" rx="20" ry="9.5" transform="rotate(-152 348 650)" />
      <ellipse cx="392" cy="666" rx="19" ry="9" transform="rotate(-162 392 666)" />
      <ellipse cx="438" cy="672" rx="17" ry="8.5" transform="rotate(-172 438 672)" />

      <!-- Inner Grains Tier -->
      <ellipse cx="294" cy="275" rx="15" ry="7" transform="rotate(-48 294 275)" fill="#FEF08A" />
      <ellipse cx="274" cy="320" rx="16" ry="7.5" transform="rotate(-68 274 320)" fill="#FEF08A" />
      <ellipse cx="262" cy="370" rx="16" ry="8" transform="rotate(-82 262 370)" fill="#FEF08A" />
      <ellipse cx="258" cy="422" rx="16" ry="8" transform="rotate(-95 258 422)" fill="#FEF08A" />
      <ellipse cx="264" cy="475" rx="16" ry="8" transform="rotate(-108 264 475)" fill="#FEF08A" />
      <ellipse cx="280" cy="525" rx="16" ry="8" transform="rotate(-122 280 525)" fill="#FEF08A" />
      <ellipse cx="308" cy="572" rx="16" ry="8" transform="rotate(-138 308 572)" fill="#FEF08A" />
      <ellipse cx="346" cy="610" rx="15" ry="7.5" transform="rotate(-152 346 610)" fill="#FEF08A" />
    </g>
  </g>

  <!-- 5. Right Wreath: KAPAS (Cotton Blossoms with Green Sepals) -->
  <g>
    <!-- Cotton Green Stem extending up close to the Star -->
    <path d="M 520,670 C 735,640 785,480 770,375 C 758,310 720,245 565,210" fill="none" stroke="#15803D" strokeWidth="5.5" strokeLinecap="round" />

    <!-- 9 Cotton Blossoms -->
    <!-- Boll 1: Near Star -->
    <g transform="translate(565, 212)">
      <polygon points="-8,4 0,-12 8,4 0,14" fill="#15803D" />
      <circle cx="-6" cy="-2" r="8.5" fill="#FFFFFF" />
      <circle cx="6" cy="-2" r="8.5" fill="#FFFFFF" />
      <circle cx="0" cy="-8" r="8.5" fill="#FFFFFF" />
      <circle cx="-5" cy="6" r="7.5" fill="#F1F5F9" />
      <circle cx="5" cy="6" r="7.5" fill="#F1F5F9" />
    </g>

    <!-- Boll 2 -->
    <g transform="translate(635, 240)">
      <polygon points="-10,4 0,-13 10,4 0,15" fill="#15803D" />
      <circle cx="-7" cy="-2" r="9.5" fill="#FFFFFF" />
      <circle cx="7" cy="-2" r="9.5" fill="#FFFFFF" />
      <circle cx="0" cy="-9" r="9.5" fill="#FFFFFF" />
      <circle cx="-5" cy="7" r="8.5" fill="#F1F5F9" />
      <circle cx="5" cy="7" r="8.5" fill="#F1F5F9" />
    </g>

    <!-- Boll 3 -->
    <g transform="translate(688, 285)">
      <polygon points="-11,5 0,-14 11,5 0,16" fill="#15803D" />
      <circle cx="-8" cy="-3" r="10.5" fill="#FFFFFF" />
      <circle cx="8" cy="-3" r="10.5" fill="#FFFFFF" />
      <circle cx="0" cy="-10" r="10.5" fill="#FFFFFF" />
      <circle cx="-6" cy="8" r="9.5" fill="#F1F5F9" />
      <circle cx="6" cy="8" r="9.5" fill="#F1F5F9" />
    </g>

    <!-- Boll 4 -->
    <g transform="translate(730, 342)">
      <polygon points="-12,5 0,-14 12,5 0,16" fill="#15803D" />
      <circle cx="-9" cy="-3" r="11.5" fill="#FFFFFF" />
      <circle cx="9" cy="-3" r="11.5" fill="#FFFFFF" />
      <circle cx="0" cy="-11" r="11.5" fill="#FFFFFF" />
      <circle cx="-7" cy="8" r="10.5" fill="#F1F5F9" />
      <circle cx="7" cy="8" r="10.5" fill="#F1F5F9" />
    </g>

    <!-- Boll 5 -->
    <g transform="translate(758, 408)">
      <polygon points="-12,5 0,-15 12,5 0,17" fill="#15803D" />
      <circle cx="-9.5" cy="-3" r="12" fill="#FFFFFF" />
      <circle cx="9.5" cy="-3" r="12" fill="#FFFFFF" />
      <circle cx="0" cy="-11.5" r="12" fill="#FFFFFF" />
      <circle cx="-7" cy="8.5" r="11" fill="#F1F5F9" />
      <circle cx="7" cy="8.5" r="11" fill="#F1F5F9" />
    </g>

    <!-- Boll 6 -->
    <g transform="translate(766, 478)">
      <polygon points="-12,5 0,-15 12,5 0,17" fill="#15803D" />
      <circle cx="-9.5" cy="-3" r="12" fill="#FFFFFF" />
      <circle cx="9.5" cy="-3" r="12" fill="#FFFFFF" />
      <circle cx="0" cy="-11.5" r="12" fill="#FFFFFF" />
      <circle cx="-7" cy="8.5" r="11" fill="#F1F5F9" />
      <circle cx="7" cy="8.5" r="11" fill="#F1F5F9" />
    </g>

    <!-- Boll 7 -->
    <g transform="translate(748, 548)">
      <polygon points="-12,5 0,-14 12,5 0,16" fill="#15803D" />
      <circle cx="-9" cy="-3" r="11.5" fill="#FFFFFF" />
      <circle cx="9" cy="-3" r="11.5" fill="#FFFFFF" />
      <circle cx="0" cy="-11" r="11.5" fill="#FFFFFF" />
      <circle cx="-7" cy="8" r="10.5" fill="#F1F5F9" />
      <circle cx="7" cy="8" r="10.5" fill="#F1F5F9" />
    </g>

    <!-- Boll 8 -->
    <g transform="translate(710, 612)">
      <polygon points="-11,5 0,-14 11,5 0,16" fill="#15803D" />
      <circle cx="-8" cy="-3" r="11" fill="#FFFFFF" />
      <circle cx="8" cy="-3" r="11" fill="#FFFFFF" />
      <circle cx="0" cy="-10" r="11" fill="#FFFFFF" />
      <circle cx="-6" cy="8" r="10" fill="#F1F5F9" />
      <circle cx="6" cy="8" r="10" fill="#F1F5F9" />
    </g>

    <!-- Boll 9 -->
    <g transform="translate(650, 660)">
      <polygon points="-11,5 0,-13 11,5 0,15" fill="#15803D" />
      <circle cx="-8" cy="-3" r="10" fill="#FFFFFF" />
      <circle cx="8" cy="-3" r="10" fill="#FFFFFF" />
      <circle cx="0" cy="-9.5" r="10" fill="#FFFFFF" />
      <circle cx="-6" cy="7.5" r="9" fill="#F1F5F9" />
      <circle cx="6" cy="7.5" r="9" fill="#F1F5F9" />
    </g>
  </g>

  <!-- 6. Golden Tie Ribbon Knot at Base of Wreaths -->
  <g transform="translate(500, 680)">
    <circle cx="0" cy="0" r="15" fill="#FFE600" stroke="#854D0E" strokeWidth="2.5" />
    <!-- Left Loop -->
    <path d="M -15,0 C -45,-18 -75,-6 -85,12 C -70,22 -40,12 -15,5 Z" fill="#FFE600" stroke="#854D0E" strokeWidth="2" />
    <!-- Right Loop -->
    <path d="M 15,0 C 45,-18 75,-6 85,12 C 70,22 40,12 15,5 Z" fill="#FFE600" stroke="#854D0E" strokeWidth="2" />
    <!-- Left Tail Swirl -->
    <path d="M -10,12 C -24,35 -40,55 -50,60 C -42,62 -20,44 -5,17 Z" fill="#FACC15" stroke="#854D0E" strokeWidth="1.8" />
    <!-- Right Tail Swirl -->
    <path d="M 10,12 C 24,35 40,55 50,60 C 42,62 20,44 5,17 Z" fill="#FACC15" stroke="#854D0E" strokeWidth="1.8" />
  </g>

  <!-- 7. Golden Wings (Sayap Garuda) -->
  <g fill="#FFE600" stroke="#78350F" strokeWidth="2" strokeLinejoin="round">
    <!-- Left Wing -->
    <g>
      <path d="M 390,560 C 350,510 330,370 348,305 C 368,348 375,445 405,535 Z" fill="#FEF08A" />
      <path d="M 398,565 C 365,525 352,400 372,335 C 385,380 392,470 415,545 Z" fill="#FDE047" />
      <path d="M 406,572 C 382,535 372,435 392,375 C 405,415 408,495 424,555 Z" fill="#FACC15" />
      <path d="M 415,580 C 398,550 392,475 408,420 C 418,455 422,515 432,565 Z" fill="#EAB308" />
      <path d="M 422,588 C 412,565 408,515 420,465 C 428,495 430,535 438,575 Z" fill="#CA8A04" />
    </g>

    <!-- Right Wing -->
