      d="M 474,412 
         L 522,412 
         C 530,440 524,464 510,480 
         L 470,480 
         C 466,455 466,434 474,412 Z"
      fill="#FFE600"
      stroke="#000000"
      strokeWidth="2"
    />
    <!-- White Folder / Map / Agenda with Black Outline -->
    <polygon points="522,418 545,424 539,474 516,470" fill="#FFFFFF" stroke="#000000" strokeWidth="2.5" />
    <line x1="522" y1="432" x2="542" y2="438" stroke="#000000" strokeWidth="1.5" />
  </g>

  <!-- 11. Bottom Red Curved Banner: KARTIKA EKA PAKSI -->
  <g>
    <!-- Left Swallowtail Ribbon End -->
    <path
      d="M 195,642 
         L 115,675 
         L 145,710 
         L 115,745 
         L 188,712 Z"
      fill="#E51E2B"
      stroke="#FFE600"
      strokeWidth="3.5"
      strokeLinejoin="round"
    />
    <!-- Left Fold Shading -->
    <polygon points="188,712 195,642 210,685" fill="#7F1D1D" />

    <!-- Right Swallowtail Ribbon End -->
    <path
      d="M 805,642 
         L 885,675 
         L 855,710 
         L 885,745 
         L 812,712 Z"
      fill="#E51E2B"
      stroke="#FFE600"
      strokeWidth="3.5"
      strokeLinejoin="round"
    />
    <!-- Right Fold Shading -->
    <polygon points="812,712 805,642 790,685" fill="#7F1D1D" />

    <!-- Main Curved Ribbon Body -->
    <path
      d="M 195,642 
         Q 500,775 805,642 
         L 812,712 
         Q 500,845 188,712 Z"
      fill="#E51E2B"
      stroke="#FFE600"
      strokeWidth="4"
      strokeLinejoin="round"
    />

    <!-- Ribbon Yellow Inner Trim Accents -->
    <path d="M 200,648 Q 500,781 800,648" fill="none" stroke="#FEF08A" strokeWidth="1.5" />
    <path d="M 194,706 Q 500,839 806,706" fill="none" stroke="#FEF08A" strokeWidth="1.5" />

    
    <!-- Text: KARTIKA EKA PAKSI (Direct High-Contrast Letters) -->
    <g id="kartika-letters" font-family="Impact, 'Arial Black', -apple-system, sans-serif" font-weight="900" font-size="34" fill="#FFE600" stroke="#000000" stroke-width="2" stroke-linejoin="round" text-anchor="middle">
      <text x="260.0" y="696.0" transform="rotate(17.0 260.0 696.0)">K</text>
      <text x="288.0" y="721.0" transform="rotate(15.0 288.0 721.0)">A</text>
      <text x="318.0" y="743.0" transform="rotate(13.0 318.0 743.0)">R</text>
      <text x="348.0" y="762.0" transform="rotate(11.0 348.0 762.0)">T</text>
      <text x="376.0" y="778.0" transform="rotate(8.5 376.0 778.0)">I</text>
      <text x="404.0" y="790.0" transform="rotate(6.5 404.0 790.0)">K</text>
      <text x="435.0" y="799.0" transform="rotate(4.0 435.0 799.0)">A</text>
      <text x="496.0" y="806.0" transform="rotate(-0.0 496.0 806.0)">E</text>
      <text x="526.0" y="804.0" transform="rotate(-2.5 526.0 804.0)">K</text>
      <text x="556.0" y="799.0" transform="rotate(-5.0 556.0 799.0)">A</text>
      <text x="616.0" y="779.0" transform="rotate(-9.0 616.0 779.0)">P</text>
      <text x="646.0" y="763.0" transform="rotate(-11.5 646.0 763.0)">A</text>
      <text x="676.0" y="744.0" transform="rotate(-13.5 676.0 744.0)">K</text>
      <text x="705.0" y="722.0" transform="rotate(-15.5 705.0 722.0)">S</text>
      <text x="734.0" y="697.0" transform="rotate(-17.5 734.0 697.0)">I</text>
    </g>
  </g>
</svg>
