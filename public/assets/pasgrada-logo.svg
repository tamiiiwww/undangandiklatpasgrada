      d="M 418,362 
         C 405,340 410,314 435,310 
         C 426,325 438,332 452,320 
         C 442,338 465,332 485,318 
         C 515,296 542,314 524,342 
         C 512,352 492,346 480,354 
         C 468,362 460,365 450,365 Z"
      fill="#E51E2B"
      stroke="#991B1B"
      strokeWidth="2.5"
    />

    <!-- White Stylized Flame Ribbon / Wave Highlight -->
    <path
      d="M 428,358 
         C 434,340 452,330 472,328 
         C 488,326 508,318 518,336 
         C 506,346 488,340 476,344 
         C 460,350 448,356 438,360 Z"
      fill="#FFFFFF"
      opacity="0.95"
    />
  </g>

  <!-- 9. Big Stylized Yellow Numeral "2" -->
  <g>
    <path
      d="M 444,420 
         C 444,366 538,366 546,420 
         C 550,468 474,520 436,568 
         L 430,596 
         L 572,596 
         L 572,570 
         L 486,570 
         C 514,535 582,480 578,420 
         C 570,338 420,338 412,420 Z"
      fill="#FFE600"
      stroke="#000000"
      strokeWidth="5"
      strokeLinejoin="round"
    />
  </g>

  <!-- 10. Cadet / Soldier Profile Inside Numeral "2" -->
  <g>
    <!-- Cap (Topi Pet Kuning) -->
    <path
      d="M 470,366 
         C 470,348 484,340 504,340 
         C 524,340 532,352 528,370 
         C 520,374 480,374 470,366 Z"
      fill="#FFE600"
      stroke="#000000"
      strokeWidth="2"
    />
    <!-- Face Profile (White Silhouette) -->
    <path
      d="M 478,370 
         C 496,372 522,370 528,376 
         C 530,390 520,404 504,412 
         C 490,412 480,398 478,370 Z"
      fill="#FFFFFF"
      stroke="#000000"
      strokeWidth="2"
