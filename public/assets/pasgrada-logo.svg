      <path d="M 610,560 C 650,510 670,370 652,305 C 632,348 625,445 595,535 Z" fill="#FEF08A" />
      <path d="M 602,565 C 635,525 648,400 628,335 C 615,380 608,470 585,545 Z" fill="#FDE047" />
      <path d="M 594,572 C 618,535 628,435 608,375 C 595,415 592,495 576,555 Z" fill="#FACC15" />
      <path d="M 585,580 C 602,550 608,475 592,420 C 582,455 578,515 568,565 Z" fill="#EAB308" />
      <path d="M 578,588 C 588,565 592,515 580,465 C 572,495 570,535 562,575 Z" fill="#CA8A04" />
    </g>
  </g>

  <!-- 8. The Torch (Obor) with Red Flame & White Stylized Wave -->
  <g>
    <!-- Handle -->
    <path d="M 428,370 L 438,370 L 432,475 L 422,475 Z" fill="#94A3B8" stroke="#1E293B" strokeWidth="2" />
    <!-- Cup / Bowl -->
    <path d="M 412,365 L 452,365 L 442,390 L 424,390 Z" fill="#CBD5E1" stroke="#0F172A" strokeWidth="2.2" />

    <!-- Red Billowing Flame Swirling Horizontally to the Right -->
