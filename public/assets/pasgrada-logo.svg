<svg viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Text Paths for curved text -->
    <path id="pathPasgrada" d="M 230,178 Q 500,42 770,178" fill="none" />
    <path id="pathKartikaRibbon" d="M 232,710 Q 500,836 768,710" fill="none" />

    <!-- Gold Facet Gradients for Star -->
    <linearGradient id="starLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF275" />
      <stop offset="100%" stopColor="#EAB308" />
    </linearGradient>
    <linearGradient id="starDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#A16207" />
      <stop offset="100%" stopColor="#713F12" />
    </linearGradient>

    <!-- Rice Grain Gradient -->
    <linearGradient id="riceGrainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FEF08A" />
      <stop offset="50%" stopColor="#FACC15" />
      <stop offset="100%" stopColor="#CA8A04" />
    </linearGradient>
  </defs>

  <!-- 1. Background Shield (Black with Solid Bright Yellow Contour Border) -->
  <path
    d="M 195,52 
       Q 500,82 805,52 
       C 810,95 822,122 842,146 
       C 872,182 915,218 964,268 
       C 948,455 898,625 772,804 
       C 672,904 582,950 500,974 
       C 418,950 328,904 228,804 
       C 102,625 52,455 36,268 
       C 85,218 128,182 158,146 
       C 178,122 190,95 195,52 Z"
    fill="#000000"
    stroke="#FFE600"
    strokeWidth="16"
    strokeLinejoin="round"
  />

  
  <!-- 2. Top Curved Text: PASGRADA (Direct High-Contrast Letters) -->
  <g id="pasgrada-letters" font-family="Impact, 'Arial Black', -apple-system, sans-serif" font-weight="900" font-size="62" fill="#FFE600" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" text-anchor="middle">
    <text x="240.0" y="150.0" transform="rotate(-20.0 240.0 150.0)">P</text>
    <text x="314.0" y="132.0" transform="rotate(-14.0 314.0 132.0)">A</text>
    <text x="388.0" y="120.0" transform="rotate(-8.0 388.0 120.0)">S</text>
    <text x="462.0" y="115.0" transform="rotate(-3.0 462.0 115.0)">G</text>
    <text x="538.0" y="115.0" transform="rotate(3.0 538.0 115.0)">R</text>
    <text x="612.0" y="120.0" transform="rotate(8.0 612.0 120.0)">A</text>
    <text x="686.0" y="132.0" transform="rotate(14.0 686.0 132.0)">D</text>
    <text x="760.0" y="150.0" transform="rotate(20.0 760.0 150.0)">A</text>
  </g>

  <!-- 3. Faceted 3D Gold Star -->
  <g transform="translate(500, 186)">
    <!-- Top Point -->
    <polygon points="0,-48 0,0 -15,-11" fill="url(#starLight)" />
    <polygon points="0,-48 0,0 15,-11" fill="url(#starDark)" />
    <!-- Top-Right Point -->
    <polygon points="46,-15 0,0 15,-11" fill="url(#starLight)" />
    <polygon points="46,-15 0,0 13,13" fill="url(#starDark)" />
    <!-- Bottom-Right Point -->
    <polygon points="29,39 0,0 13,13" fill="url(#starLight)" />
    <polygon points="29,39 0,0 0,15" fill="url(#starDark)" />
    <!-- Bottom-Left Point -->
    <polygon points="-29,39 0,0 0,15" fill="url(#starDark)" />
    <polygon points="-29,39 0,0 -13,13" fill="url(#starLight)" />
    <!-- Top-Left Point -->
    <polygon points="-46,-15 0,0 -13,13" fill="url(#starDark)" />
    <polygon points="-46,-15 0,0 -15,-11" fill="url(#starLight)" />
    <!-- Crisp Contour -->
    <polygon points="0,-48 15,-11 46,-15 13,13 29,39 0,15 -29,39 -13,13 -46,-15 -15,-11" fill="none" stroke="#854D0E" strokeWidth="1.5" />
  </g>

  <!-- 4. Left Wreath: PADI (Golden Rice Stalk) -->
  <g>
